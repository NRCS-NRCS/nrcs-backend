app:
  environment: PROD
  # settings.py reads APP_TYPE (Sentry app_type tag). Let banjo-helm set it per workload
  # (web / worker / hook) instead of hardcoding a role in shared env.
  appTypeEnvName: APP_TYPE
  # Global image
  image:
    name: SET-BY-CICD-IMAGE
    tag: SET-BY-CICD-TAG
    imagePullPolicy: IfNotPresent

  api:
    enabled: true
    containerPort: 80
    command: ["/code/deploy/run_prod.sh"]
    probes:
      enabled: true    # chart defaults: liveness /healthz/live/, readiness+startup /healthz/ready/
    ingress:
      enabled: true
      # NOTE: className left blank on purpose; body-size + ingress class are set in
      # values/traefik.yaml. Set `host` per environment in the env overlay.
      className:
      host:
    resources:
      requests:
        cpu: "0.1"
        memory: 0.5Gi
      limits:
        cpu: "2"
        memory: 1Gi

  # This project has no Celery workers.
  worker:
    enabled: false

  hooks:
    enabled: true
    jobs:
      # NOTE: Make sure keys are lowercase.
      # db-migrate and collect-static inherit the chart defaults (manage.py migrate /
      # collectstatic --noinput). wait-for-resources (Sync hook, early wave) gates the
      # app on DB + S3 connectivity.
      wait-for-resources:
        command: ["./manage.py", "wait_for_resources", "--db", "--minio"]

  # NOTE: Check main/settings.py for all available options. Per-environment values
  # (domains, S3 endpoint, and all secrets) are supplied by the env overlays + CICD.
  env:
    APP_RELEASE: "{{ $.Values.image.tag }}"
    APP_ENVIRONMENT: "{{ $.Values.environment }}"
    TIME_ZONE: "Asia/Kathmandu"
    DEBUG: "false"
    # S3 storage on by default; bucket names, endpoint and credentials are supplied
    # per-environment (deployer's choice) — see main/settings.py for the variables.
    AWS_S3_ENABLED: "true"
    # Sentry
    SENTRY_ENABLED: "false"
    SENTRY_TRACES_SAMPLE_RATE: "0.2"
    SENTRY_PROFILE_SAMPLE_RATE: "0.2"
