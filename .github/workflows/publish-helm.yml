name: Publish

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - project/*
      # TODO: remove before merge — temporary trigger to test the publish pipeline
      # (docker + helm push) on this feature branch prior to opening the PR.
      - feature/banjo-stack
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  _:
    uses: toggle-corp/banjo-action/.github/workflows/pipeline.yml@v0.2.0
    permissions:
      contents: read
      packages: write
      pull-requests: read
    with:
      # -- Same as CI (./ci.yml)
      # Job: Docker
      docker__wait_cmd: "./manage.py wait_for_resources --db"
      docker__migration_dummy_test: "main.tests.fake_test"
      docker__run_graphql_check: true
      docker__run_openapi_check: false
      docker__compose_file: "docker-compose.yaml:.github/docker-compose.yaml"
      docker__compose_service_name: "web"
      docker__compose_test_cmd: "/code/misc/run_tests.sh"
      # Job: Helm
      helm__chart_directory: "./helm"
      # -- Publish
      docker__push: true
      helm__push: true
